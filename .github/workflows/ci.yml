name: ci
on: [push, pull_request]
jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python }} }
      - run: pip install --quiet ruff
      - run: ruff check rig/ tests/
      - run: ruff format --check rig/ tests/
      - run: python -m rig.cli scan --dry-run
      - run: python -m rig.watchdog.watchdog --once --dry-run
      - run: python rig/detect/device.py
  install-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash install.sh --dry-run
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet bandit
      - run: bandit -r rig/ -q || true

name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet ruff
      - run: ruff check rig/ tests/ --quiet
      - run: python -m rig.cli scan --dry-run
      - run: python -m rig.watchdog.watchdog --once --dry-run
      - run: python -m pytest tests -q 2>/dev/null || python -c "import rig; print('imports ok')"
